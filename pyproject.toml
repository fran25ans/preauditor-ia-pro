[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preauditor-ia"
version = "0.2.0"
description = "Pre-auditor local de seguridad con informes, mobile release checks y base ProofSec para invariantes y explotabilidad demostrable."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Pre-Auditor IA Pro" }
]
keywords = ["security", "audit", "llm", "ci-cd", "appsec", "preauditor", "proofsec", "authorization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "reportlab>=3.6",
]

[project.optional-dependencies]
dev = []

[project.scripts]
preauditor = "preauditor:main"
preauditor-ui = "preauditor_ui:main"
mobile-release-radar = "mobile_release_radar:main"
mobile-release-ui = "mobile_release_ui:main"
proofsec = "proofsec.cli:main"
proofsec-ui = "proofsec_ui:main"

[tool.setuptools]
py-modules = ["preauditor", "preauditor_ui", "mobile_release_radar", "mobile_release_ui", "proofsec_ui"]
packages = ["proofsec", "proofsec.discovery", "proofsec.http", "proofsec.llm"]
